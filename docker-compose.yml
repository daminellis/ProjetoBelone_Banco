version: '3.8'

services:
  frontend:
    build:
      context: .  # Contexto na raiz do projeto
      dockerfile: Dockerfile  # Dockerfile na raiz
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./BackEnd  # Diretório do backend
    ports:
      - "3000:3000"
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dbbanco
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
